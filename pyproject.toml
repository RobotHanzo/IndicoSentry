[build-system]
requires = ['hatchling==1.27.0']
build-backend = 'hatchling.build'

[project]
name = 'indico-plugin-sentry'
description = 'Sentry error monitoring and performance tracing for Indico'
readme = 'README.md'
license = 'MIT'
authors = [{ name = 'RobotHanzo' }]
classifiers = [
    'Environment :: Plugins',
    'Environment :: Web Environment',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
]
requires-python = '>=3.12.2, <3.13'
dynamic = ['version']
dependencies = [
    'indico>=3.3',
    # Indico itself already depends on sentry-sdk; these are the extras the
    # plugin relies on beyond what core sets up.
    'sentry-sdk[flask,celery,sqlalchemy,pure_eval]>=2.20,<3',
]

[project.optional-dependencies]
dev = ['pytest>=8', 'pytest-cov>=5', 'ruff>=0.8']

[project.urls]
Homepage = 'https://github.com/indico/indico'

[project.entry-points.'indico.plugins']
sentry = 'indico_sentry.plugin:SentryPlugin'

[tool.hatch.version]
path = 'indico_sentry/__init__.py'

[tool.hatch.build]
include = ['indico_sentry']

[tool.hatch.build.targets.wheel]
packages = ['indico_sentry']

[tool.pytest.ini_options]
testpaths = ['tests']
# Indico ships a pytest plugin that pulls in its whole database fixture stack
# (and needs docker).  These tests do not use it.
addopts = '-p no:indico'
